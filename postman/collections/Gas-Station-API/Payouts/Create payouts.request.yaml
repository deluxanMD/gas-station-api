$kind: http-request
method: POST
url: '{{base_url}}/payouts'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "shiftId": {{shift_id}},
      "userId": {{db_user_id}},
      "totalPos": 1000,
      "lottoPayout": 50,
      "vendorPayout": 72.5,
      "ownerPayout": 0,
      "miscPayout": 0,
      "lottoWinner": 25,
      "giftCertificates": 0,
      "redemptions": 0,
      "safedrops": 200,
      "cashOnHand": 577.3
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('created', () => pm.response.to.have.status(201));
