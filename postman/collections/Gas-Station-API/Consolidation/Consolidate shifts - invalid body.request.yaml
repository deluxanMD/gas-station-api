$kind: http-request
method: POST
url: '{{base_url}}/shifts/consolidated'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "shiftIds": []
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('rejects with 400', () => pm.response.to.have.status(400));
