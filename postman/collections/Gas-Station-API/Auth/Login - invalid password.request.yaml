$kind: http-request
method: POST
url: '{{base_url}}/auth/login'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "userId": "{{user_id}}",
      "password": "wrong-password"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('rejects with 401', () => pm.response.to.have.status(401));
