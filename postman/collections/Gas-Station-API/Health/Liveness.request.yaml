$kind: http-request
method: GET
url: '{{base_url}}/health/live'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns 200 alive', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().status).to.eql('alive');
      });
