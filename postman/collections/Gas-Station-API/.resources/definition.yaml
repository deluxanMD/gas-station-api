$kind: collection
name: Gas Station API
description: Gas Station Portal backend API. Select the "Gas Station Local" environment to run against a dev server.
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
variables:
  - key: base_url
    value: 'http://localhost:3000/api/v1'
  - key: user_id
    value: 'demo_user'
  - key: password
    value: 'Passw0rd!'
  - key: user_role
    value: 'OWNER'
    description: One of the roles.code values (e.g. MANAGER, DISPATCH)
  - key: db_user_id
    value: ''
    description: Numeric users.id; set automatically by Auth / Login
  - key: shift_id
    value: ''
    description: Set automatically by Shifts / Start shift
  - key: shift_date
    value: '2026-11-09'
    description: Calendar day (YYYY-MM-DD) for the "List shifts - by date" request
  - key: access_token
    value: ''
    description: Bearer token; set automatically by Auth / Login
