$kind: http-request
method: POST
url: '{{base_url}}/fuel'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "shiftId": {{shift_id}},
      "userId": {{db_user_id}},
      "biodieselVolume": 100.25,
      "biodieselTotal": 150,
      "reg87Volume": 200.5,
      "reg87Total": 300,
      "extra89Volume": 10,
      "extra89Total": 15,
      "supr91Volume": 20,
      "supr91Total": 30,
      "plus93Volume": 0,
      "plus93Total": 0,
      "totalVolume": 330.75
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('created', () => {
        pm.response.to.have.status(201);
        pm.expect(String(pm.response.json().data.shiftId)).to.eql(pm.collectionVariables.get('shift_id'));
      });
