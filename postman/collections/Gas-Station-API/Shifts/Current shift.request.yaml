$kind: http-request
method: GET
url: '{{base_url}}/shifts/current?userId={{db_user_id}}'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns 200', () => pm.response.to.have.status(200));
      pm.test('returns the open shift', () => pm.expect(pm.response.json().data.endTime).to.eql(null));
