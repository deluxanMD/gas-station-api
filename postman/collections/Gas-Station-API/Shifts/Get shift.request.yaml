$kind: http-request
method: GET
url: '{{base_url}}/shifts/{{shift_id}}'
order: 7000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns the shift', () => {
        pm.response.to.have.status(200);
        pm.expect(String(pm.response.json().data.id)).to.eql(pm.collectionVariables.get('shift_id'));
      });
