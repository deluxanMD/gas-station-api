$kind: http-request
method: POST
url: '{{base_url}}/daily-summary-reports'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "shiftId": {{shift_id}},
      "userId": {{db_user_id}},
      "endDate": "2026-11-09T23:30:00.000Z",
      "fuelSales": 6000,
      "itemSales": 3000,
      "gst": 450,
      "hst": 0,
      "pennyRounding": -0.02,
      "totalSales": 9449.98
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('created', () => pm.response.to.have.status(201));
