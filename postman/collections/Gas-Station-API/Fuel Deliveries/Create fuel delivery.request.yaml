$kind: http-request
method: POST
url: '{{base_url}}/fuel-deliveries'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "shiftId": {{shift_id}},
      "userId": {{db_user_id}},
      "deliveryDate": "2026-11-08",
      "bolNumber": "BOL-{{$timestamp}}",
      "reg": 5000,
      "prem": 2000.5,
      "diesel": 3000,
      "total": 10000.5
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('created', () => {
        pm.response.to.have.status(201);
        pm.expect(String(pm.response.json().data.shiftId)).to.eql(pm.collectionVariables.get('shift_id'));
      });
